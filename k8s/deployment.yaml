apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-self-healing-app
  labels:
    app: k8s-self-healing-app
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: k8s-self-healing-app
  template:
    metadata:
      labels:
        app: k8s-self-healing-app
    spec:
      containers:
        - name: flask
          image: k8s-self-healing-app:1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: APP_VERSION
              value: "1.1.0"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
